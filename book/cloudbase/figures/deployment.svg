<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330">
  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2, #4a463f)"/>
    </marker>
  </defs>
  <style>
    .box { fill: none; stroke: var(--ink-2, #4a463f); stroke-width: 1.4; }
    .frame { fill: none; stroke: var(--ink-3, #7a756b); stroke-width: 1; stroke-dasharray: 5 4; }
    .group { fill: var(--ink-3, #7a756b); font-size: 11px; letter-spacing: 1.6px; text-anchor: start; }
    .name { fill: var(--ink, #1d1b17); font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .sub { fill: var(--ink-2, #4a463f); font-size: 11.5px; font-style: italic; text-anchor: middle; }
    .label { fill: var(--accent-ink, #6a2522); font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; }
    .mid { text-anchor: middle; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .flow { stroke: var(--ink-2, #4a463f); stroke-width: 1.4; fill: none; marker-end: url(#dep-arrow); }
    .dash { stroke-dasharray: 4 4; }
  </style>

  <!-- frames -->
  <rect class="frame" x="150" y="20" width="430" height="295" rx="8"/>
  <text class="group" x="165" y="42">ENVIRONMENT</text>
  <rect class="frame" x="620" y="20" width="170" height="295" rx="8"/>
  <text class="group" x="635" y="42">ACCOUNT</text>

  <!-- browser -->
  <rect class="box" x="10" y="60" width="110" height="60" rx="4"/>
  <text class="name" x="65" y="88">Browser</text>
  <text class="sub" x="65" y="106">users</text>

  <!-- environment -->
  <rect class="box" x="180" y="60" width="150" height="60" rx="4"/>
  <text class="name" x="255" y="86">Web service</text>
  <text class="sub" x="255" y="104">public domain</text>

  <rect class="box" x="400" y="60" width="150" height="60" rx="4"/>
  <text class="name" x="475" y="86">API service</text>
  <text class="sub" x="475" y="104">internal address</text>

  <rect class="box" x="400" y="160" width="150" height="50" rx="4"/>
  <text class="name" x="475" y="182">HTTP gateway</text>
  <text class="sub" x="475" y="199">REST and RPC</text>

  <rect class="box" x="400" y="245" width="150" height="50" rx="4"/>
  <text class="name" x="475" y="267">PostgreSQL</text>
  <text class="sub" x="475" y="284">schema and data</text>

  <rect class="box" x="180" y="245" width="150" height="50" rx="4"/>
  <text class="name" x="255" y="267">Storage bucket</text>
  <text class="sub" x="255" y="284">the environment's own</text>

  <!-- account -->
  <rect class="box" x="640" y="60" width="140" height="50" rx="4"/>
  <text class="name" x="710" y="82">CAM users</text>
  <text class="sub" x="710" y="99">COS and SES keys</text>

  <rect class="box" x="640" y="160" width="140" height="50" rx="4"/>
  <text class="name" x="710" y="182">Tencent SES</text>
  <text class="sub" x="710" y="199">sender, templates</text>

  <rect class="box" x="640" y="245" width="140" height="50" rx="4"/>
  <text class="name" x="710" y="267">DNS, certificates</text>
  <text class="sub" x="710" y="284">domain names</text>

  <!-- requests -->
  <path class="flow" d="M120 90 H178"/>
  <text class="label mid" x="149" y="82">HTTPS</text>

  <path class="flow" d="M330 90 H398"/>
  <text class="label mid" x="364" y="82">/api</text>

  <path class="flow" d="M475 120 V158"/>
  <text class="label start" x="483" y="144">API key</text>

  <path class="flow" d="M475 210 V243"/>

  <path class="flow" d="M415 120 L312 241"/>
  <text class="label end" x="300" y="215">signs URLs</text>

  <path class="flow" d="M550 110 L638 178"/>

  <path class="flow" d="M638 85 H552"/>
  <text class="label mid" x="600" y="77">keys</text>

  <!-- direct transfer -->
  <path class="flow dash" d="M65 120 V270 H178"/>
  <text class="label mid" x="122" y="262">signed URLs</text>
</svg>
