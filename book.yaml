# Parts are categories; chapters are the topics inside them. Chapters are
# numbered continuously through the book, parts with Roman numerals.
# Each part directory needs an index.md; each chapter is one Markdown file
# with a YAML front matter block (title, summary, optional status, references).
parts:
  - dir: foundations
    title: Foundations
    chapters:
      - anatomy.md
      - domains.md
      - access.md
      - databases.md
      - services.md
      - storage.md
      - email.md
      - releases.md
  - dir: cloudbase
    title: Tencent CloudBase
    chapters:
      - overview.md
      - environment.md
      - cam.md
      - database.md
      - cloud-run.md
      - storage-email.md
      - operations.md
